<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="scripts/main.js"></script>
    <script src="/scripts/search.js" defer></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/results.css">

    <title>Bookshelf app</title>
    <link rel="icon" type="image/png" href="../resources/logo.png">
</head>
<body class="lato-regular">
    <div id="root">
        <header>
            <a href="/" class="logo-link" aria-label="Bookshelf app home">
                <img src="/resources/logo.png" alt="Bookshelf app logo" class="site-logo">
                <h1>Bookshelf app</h1>
            </a>
            <form class="search-bar" id="search-form">
                <label for="search">
                    <iconify-icon icon="ic:baseline-search" data-inline="false" width="32" aria-hidden="true"></iconify-icon>
                    <span class="sr-only">Search</span>
                </label>
                <input 
                    type="text"
                    id="search"
                />
                <input type="submit" value="Search">
            </form>
            <nav class="nav-btns" aria-label="Main navigation">
                <a href="/" aria-label="Home">
                    <iconify-icon icon="ic:baseline-local-library" data-inline="false" width="32" class="icon-button" aria-hidden="true"></iconify-icon>
                </a>
                <a href="/user/statistics" aria-label="Statistics">
                    <iconify-icon icon="ic:baseline-bar-chart" data-inline="false" width="32" aria-hidden="true"></iconify-icon>
                </a>
                <a href="/user/settings" aria-label="Settings">
                    <iconify-icon icon="ic:outline-settings" data-inline="false" width="32" aria-hidden="true"></iconify-icon>
                </a>
                <a class="skip-link" href="#main">Skip to content</a>
            </nav>
        </header>
        <main>
            <h2>Search results</h2>
            <section class="shelf-table">
                <div class="table-header">
                        <span>cover</span>
                        <span>title</span>
                        <span>author</span>
                        <span>avg rating</span>
                        <span>rating</span>
                        <span>shelves</span>
                        <span>date read</span>
                        <span>date added</span>
                </div>
                <div class="search">
                    <span>Filters</span>                    
                    <div id="search-results" class="search-results"></div>
                </div>
            </section>
        </main>
        <footer>
            <p>Project made for course "Kasutajaliidese disain ja arendus" by Lisanne Järv and Sten Reins</p>
        </footer>
    </div>
</body>
</html>
