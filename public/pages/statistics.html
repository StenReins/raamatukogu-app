<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../scripts/main.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <title>Statistics</title>
</head>
<body class="lato-regular">
    <div id="root">
        <header>
            <h1>Bookshelf app</h1>

            <form class="search-bar" id="search-form">
                <label for="search">
                    <iconify-icon icon="ic:baseline-search" data-inline="false" width="32" aria-label="Search"></iconify-icon>
                </label>
                <input 
                    type="text"
                    id="search"
                />
                <input type="submit" value="Search">
            </form>

            <nav class="nav-btns">
                <a href="../index.html">
                    <iconify-icon icon="ic:baseline-local-library" data-inline="false" width="32" class="icon-button"></iconify-icon>
                </a>
                <a href="search.html">
                    <iconify-icon icon="ic:baseline-search" data-inline="false" width="32"></iconify-icon>
                </a>
                <a href="statistics.html">
                    <iconify-icon icon="ic:baseline-bar-chart" data-inline="false" width="32"></iconify-icon>
                </a>
                <a href="settings.html">
                    <iconify-icon icon="ic:outline-settings" data-inline="false" width="32"></iconify-icon>
                </a>
            </nav>
        </header>

        <main class="statistics-page">
            <section class="stats-card stats-summary">
                <div class="summary-item">
                    <iconify-icon icon="ic:outline-menu-book" width="44"></iconify-icon>
                    <strong>10,839</strong>
                    <span>pages read</span>
                </div>

                <div class="year-summary">
                    <h2>2026</h2>
                    <h3>Year in Books</h3>
                    <div class="profile-circle"></div>
                    <p>Username</p>
                </div>

                <div class="summary-item">
                    <iconify-icon icon="ic:outline-book" width="44"></iconify-icon>
                    <strong>36</strong>
                    <span>books read</span>
                </div>
            </section>

            <section class="stats-card stats-details">
                <div class="monthly-books">
                    <div class="month-row">
                        <span>January</span>
                        <div class="month-covers">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                        </div>
                    </div>

                    <div class="month-row">
                        <span>February</span>
                        <div class="month-covers">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                        </div>
                    </div>

                    <div class="month-row">
                        <span>March</span>
                        <div class="month-covers">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                        </div>
                    </div>

                    <div class="month-row">
                        <span>April</span>
                        <div class="month-covers">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                            <img src="../resources/test-cover.jpg" alt="Book cover">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                        </div>
                    </div>

                    <div class="month-row">
                        <span>May</span>
                        <div class="month-covers">
                            <img src="../resources/test-cover2.jpg" alt="Book cover">
                        </div>
                    </div>

                    <div class="month-row"><span>June</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>July</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>August</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>September</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>October</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>November</span><div class="month-covers"></div></div>
                    <div class="month-row"><span>December</span><div class="month-covers"></div></div>
                </div>

                <aside class="stats-side">
                    <div class="average-length">
                        <h2>Average book in length</h2>
                        <strong>358</strong>
                        <span>pages</span>
                    </div>

                    <div class="average-rating">
                        <h2>My average book rating</h2>
                        <div class="rating-stars">☆ ☆ ☆ ☆ ☆</div>
                        <strong>3.6</strong>
                    </div>

                    <div class="book-extremes">
                        <div class="extreme-book">
                            <img src="../resources/test-cover.jpg" alt="Longest book">
                            <h3>Longest book</h3>
                            <strong>408</strong>
                            <span>pages</span>
                        </div>

                        <div class="extreme-book">
                            <img src="../resources/test-cover2.jpg" alt="Shortest book">
                            <h3>Shortest book</h3>
                            <strong>232</strong>
                            <span>pages</span>
                        </div>
                    </div>
                </aside>
            </section>
        </main>
    </div>
</body>
</html>
